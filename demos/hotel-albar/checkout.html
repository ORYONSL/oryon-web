    let total = r2(accommodation + board + extrasTotal - (promo ? promo.amount : 0));
    let voucher = null;
    if (S.voucher) { voucher = { code: S.voucher, amount: r2(Math.min(VOUCHERS[S.voucher], total)) }; total = r2(total - voucher.amount); }
    return { n, base, auto, rateDiscount, accommodation, board, extras, promo, voucher, total, vat: r2(total - total / (1 + VAT)), left: Q.left, fits: Q.fits };
  }

  const freeUntil = () => addDays(B.in, -FREE_CANCEL_DAYS);
  const canCancelFree = () => freeUntil() > new Date();
  const longDate = (d) => A.fmtD(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function stepsHtml(n) {
    return `<ol class="steps ck-steps" aria-label="${k().steps.join(' · ')}">${k().steps.map((s, i) => `<li class="${i + 1 === n ? 'is-on' : i + 1 < n ? 'is-done' : ''}"${i + 1 === n ? ' aria-current="step"' : ''}>${s}</li>`).join('')}</ol>`;
  }

  function summaryHtml(c) {
    const T = k(), nightsTxt = `${c.n} ${c.n === 1 ? A.t('night') : A.t('nights')}`;
    const adultsTxt = `${B.adults} ${B.adults === 1 ? A.t('adult') : A.t('adults_l')}`;
    const mm = Math.max(0, Math.floor((S.deadline - Date.now()) / 60000)), ss = Math.max(0, Math.floor(((S.deadline - Date.now()) % 60000) / 1000));
    return `
      ${S.step === 'details' ? `<div class="timer" id="ck-timer" role="timer" aria-live="off">${A.icon('clock')}<span>${T.time_left}</span><b>${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}</b></div>` : ''}
      <div class="fcard">
        <img class="fcard__img" src="${IMG(room.img, 900)}" alt="">
        <p class="eyebrow eyebrow--plain" style="margin-bottom:8px">${T.summary}</p>
        <h2 class="h3">${room.name}${B.rooms > 1 ? ' × ' + B.rooms : ''}</h2>
        <p class="small" style="margin:6px 0 0">${A.fmtD(B.in, { weekday: 'short', day: 'numeric', month: 'long' })} → ${A.fmtD(B.out, { weekday: 'short', day: 'numeric', month: 'long' })}<br>${nightsTxt} · ${adultsTxt} · ${A.t(RATE[rateId].k)}</p>
        <ul class="lines">
          <li><span>${T.accommodation}</span><span>${money(c.base)}</span></li>
          ${c.auto ? `<li class="minus"><span>${A.t('promo_' + c.auto.key)}</span><span>−${money(c.auto.amount)}</span></li>` : ''}
          ${c.rateDiscount ? `<li class="minus"><span>${A.t('rate_nr')}</span><span>−${money(c.rateDiscount)}</span></li>` : ''}
          ${c.board ? `<li><span>${T.board}</span><span>${money(c.board)}</span></li>` : ''}
          ${c.extras.map(e => `<li><span>${XL(e.x.name)}</span><span>${money(e.amount)}</span></li>`).join('')}
          ${c.promo ? `<li class="minus"><span>${T.discount} ${c.promo.code}</span><span>−${money(c.promo.amount)}</span></li>` : ''}
          ${c.voucher ? `<li class="minus"><span>${T.voucher_l}</span><span>−${money(c.voucher.amount)}</span></li>` : ''}
          <li class="total"><span>${T.total}</span><span>${money(c.total)}</span></li>
          <li class="muted"><span>${fmt(T.vat_note, { x: money(c.vat) })}</span><span></span></li>
        </ul>
        <p class="paynote" style="margin-top:16px">${A.icon('check')}<span>${RATE[rateId].refundable ? (canCancelFree() ? fmt(T.free_cancel, { d: A.fmtD(freeUntil(), { day: 'numeric', month: 'long' }) }) : T.cancel_one) : T.nonref_note}</span></p>
      </div>
      <p class="small" style="margin-top:16px">${T.direct_perks}</p>`;
  }

  function payLabel(c) { return RATE[rateId].pay === 'full' && c.total > 0 ? fmt(k().pay_full, { x: money(c.total) }) : k().pay_guarantee; }

  function field(key, label, o = {}) {
    const v = esc(S.g[key]);
    const input = key === 'requests'
      ? `<textarea id="g-${key}" data-g="${key}" placeholder=" " maxlength="1000">${v}</textarea>`
      : `<input id="g-${key}" data-g="${key}" type="${o.type || 'text'}" placeholder=" "${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.req ? ' required' : ''} value="${v}">`;
    return `<div class="field${o.full ? ' field--full' : ''}${S.bad[key] ? ' is-bad' : ''}">${input}<label for="g-${key}">${label}${o.req ? ' *' : ''}</label><span class="err">${k().err_required}</span></div>`;
  }

  function detailsHtml(c) {
    const T = k();
    return `<section class="fpage"><div class="wrap">${stepsHtml(2)}</div><div class="wrap flayout" style="margin-top:32px">
      <form id="ck-form" novalidate>
        <div class="fsec">
          <p class="eyebrow">${T.details_t}</p>
          <h1 class="h1" style="font-size:clamp(32px,4vw,52px)">${room.n} · ${room.name}</h1>
          <p class="small">${fmt(T.hold_note, { m: HOLD_MIN })}</p>
        </div>
        <div class="fsec">
          <h2 class="h2">${T.extras_t}</h2>
          <p class="small">${T.extras_p}</p>
          <div class="xgrid">${XS.map(x => { const on = S.extras.includes(x.id); return `<button type="button" class="xopt" data-x="${x.id}" aria-pressed="${on}">
            <b>${XL(x.name)}</b><span class="price">+${money(x.unit === 'person' ? x.price * B.adults : x.price)}</span>
            <small>${XL(x.desc)}${x.unit === 'person' ? ` (${money(x.price)} ${T.per_person})` : ''}</small>
            <span class="xopt__tick">${on ? '✓ ' + T.added : '+ ' + T.add}</span></button>`; }).join('')}</div>
        </div>
        <div class="fsec">
          <h2 class="h2">${T.details_t}</h2>
          <div class="form" style="margin-top:24px">
            ${field('name', T.name, { req: true, full: true, ac: 'name' })}
            ${field('email', T.email, { type: 'email', req: true, ac: 'email' })}
            ${field('phone', T.phone, { type: 'tel', req: true, ac: 'tel' })}
            ${field('country', T.country, { ac: 'country-name' })}
            <div class="field"><select id="g-arrival" data-g="arrival"><option value="">—</option>${['12:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00+'].map(h => `<option${S.g.arrival === h ? ' selected' : ''}>${h}</option>`).join('')}</select><label for="g-arrival">${T.arrival_time}</label></div>
            ${field('requests', T.requests, { full: true })}
            <label class="check"><input type="checkbox" data-g="marketing"${S.g.marketing ? ' checked' : ''}><span>${T.marketing}</span></label>
            <label class="check"${S.bad.consent ? ' style="color:var(--error)"' : ''}><input type="checkbox" data-g="consent"${S.g.consent ? ' checked' : ''}><span>${T.consent} <a href="legal.html" target="_blank">↗</a></span></label>
          </div>
        </div>
        <div class="fsec">
          <h2 class="h2">${T.promo_t}</h2>
          <div class="codes" style="margin-top:20px">
            <div><div class="codefield"><div class="field"><input id="c-code" data-in="codeInput" placeholder=" " value="${esc(S.codeInput)}"><label for="c-code">${T.promo_code}</label></div>
              ${S.code ? `<button type="button" class="btn btn--secondary" data-act="code-rm">${T.remove}</button>` : `<button type="button" class="btn btn--secondary" data-act="code">${T.apply}</button>`}</div>
              ${S.codeMsg ? `<p class="msg ${S.codeMsg.ok ? 'msg--ok' : 'msg--err'}">${S.codeMsg.t}</p>` : ''}</div>
            <div><div class="codefield"><div class="field"><input id="c-voucher" data-in="voucherInput" placeholder=" " value="${esc(S.voucherInput)}"><label for="c-voucher">${T.voucher}</label></div>
              ${S.voucher ? `<button type="button" class="btn btn--secondary" data-act="voucher-rm">${T.remove}</button>` : `<button type="button" class="btn btn--secondary" data-act="voucher">${T.apply}</button>`}</div>
              ${S.voucherMsg ? `<p class="msg ${S.voucherMsg.ok ? 'msg--ok' : 'msg--err'}">${S.voucherMsg.t}</p>` : ''}</div>
          </div>
          <p class="ck-hint">${T.promo_hint}</p>
        </div>
        <div class="fsec">
          ${S.err ? `<p class="alert" role="alert">${S.err}</p>` : ''}
          <button type="submit" class="btn btn--primary btn--block" id="ck-pay" style="height:60px;font-size:16px">${A.icon('shield')} ${payLabel(c)}</button>
          <p class="paynote">${A.icon('shield')}<span>${RATE[rateId].pay === 'full' ? T.pay_full_note : T.pay_guarantee_note}</span></p>
          <p class="small" style="margin-top:8px">${T.demo_gateway_p}</p>
        </div>
      </form>
      <aside class="fside" id="ck-side">${summaryHtml(c)}</aside>
    </div></section>`;
  }

  function payHtml(c) {
    const T = k(), full = RATE[rateId].pay === 'full';
    return `<section class="fpage"><div class="wrap">${stepsHtml(3)}
      <div class="demo-gw">
        <p class="eyebrow eyebrow--plain" style="color:var(--warning)">${T.gw_t}</p>
        <h1 class="h2">Albar · Casa de Mar</h1>
        <p class="small">${room.name} · ${ymd(B.in)} → ${ymd(B.out)} · ${S.g.name ? esc(S.g.name) : ''}</p>
        <p class="demo-gw__amt">${money(c.total)}</p>
        <p class="small">${full ? T.to_pay : T.to_guarantee}</p>
        ${S.gwErr ? `<p class="alert" role="alert">${S.gwErr}</p>` : ''}
        <div class="actions">
          <button type="button" class="btn btn--primary${S.busy ? ' is-loading' : ''}" data-act="pay-ok">${T.demo_ok}</button>
          <button type="button" class="btn btn--secondary" data-act="pay-fail"${S.busy ? ' disabled' : ''}>${T.demo_fail}</button>
        </div>
        <p class="small" style="margin-top:28px">${T.demo_gateway_p}</p>
        <p class="small" style="margin-top:12px"><a href="#" data-act="back">${T.back_details}</a></p>
      </div></div></section>`;
  }

  function doneHtml(c) {
    const T = k(), full = RATE[rateId].pay === 'full';
    const extras = c.extras.map(e => XL(e.x.name));
    const kv = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
    return `<section class="fpage"><div class="wrap">${stepsHtml(4)}</div><div class="wrap flayout" style="margin-top:32px">
      <div>
        <p class="eyebrow" style="color:var(--success)">${T.confirmed_eyebrow}</p>
        <h1 class="display" style="font-size:clamp(40px,6vw,80px)">${fmt(T.confirmed_t, { name: esc(S.g.name.trim().split(' ')[0]) })}</h1>
        <p class="lead" style="margin-top:20px;color:var(--text-muted)">${fmt(T.confirmed_p, { email: esc(S.g.email) })}</p>
        <div class="refbox"><span>${T.ref}</span><b>${S.ref}</b></div>
        <div class="actions" style="margin-bottom:48px">
          <a class="btn btn--primary" href="index.html">${T.back_home}</a>
          <a class="btn btn--secondary" id="ck-ics" download="albar-${S.ref}.ics">${A.icon('clock')} ${T.add_calendar}</a>
          <button type="button" class="btn btn--secondary" data-act="print">${T.print}</button>
        </div>
        <dl class="kv">
          ${kv(T.stay, `${room.name}${B.rooms > 1 ? ' × ' + B.rooms : ''} · ${c.n} ${c.n === 1 ? A.t('night') : A.t('nights')} · ${B.adults} ${B.adults === 1 ? A.t('adult') : A.t('adults_l')}`)}
          ${kv(T.arrival, `${longDate(B.in)} · ${HOTEL.checkIn}`)}
          ${kv(T.departure, `${longDate(B.out)} · ${HOTEL.checkOut}`)}
          ${kv(T.rate, A.t(RATE[rateId].k))}
          ${extras.length ? kv(T.extras, extras.join(', ')) : ''}
          ${c.promo ? kv(T.discount, `${c.promo.code} · −${money(c.promo.amount)}`) : ''}
          ${c.voucher ? kv(T.voucher_l, `${c.voucher.code} · −${money(c.voucher.amount)}`) : ''}
          ${kv(T.total, `<b>${money(c.total)}</b>`)}
          ${kv(T.payment, full ? `${T.paid}: ${money(c.total)}` : T.guaranteed)}
          ${kv(T.guest, `${esc(S.g.name)} · ${esc(S.g.email)}`)}
        </dl>
      </div>
      <aside class="fside fside--after"><div class="fcard"><img class="fcard__img" src="${IMG(room.img, 900)}" alt="${room.name}"><p style="margin:0">${T.after_p}</p></div></aside>
    </div></section>`;
  }

  function msgHtml(title, p, href, btn) {
    return `<section class="fpage"><div class="wrap" style="max-width:640px"><p class="eyebrow">${room ? room.name : 'Albar'}</p><h1 class="h1">${title}</h1>
      <p class="lead" style="margin:16px 0 32px;color:var(--text-muted)">${p}</p><a class="btn btn--primary" href="${href}">${btn}</a></div></section>`;
  }

  const searchUrl = () => { const u = new URLSearchParams(); if (B.in) u.set('in', ymd(B.in)); if (B.out) u.set('out', ymd(B.out)); u.set('ad', B.adults); u.set('rm', B.rooms); if (room) u.set('room', room.id); return 'reservar.html?' + u; };

  function icsHref() {
    const d = (x) => ymd(x).replace(/-/g, '');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Albar//Demo//ES', 'BEGIN:VEVENT', `UID:${S.ref}@albar-demo`, `DTSTART;VALUE=DATE:${d(B.in)}`, `DTEND;VALUE=DATE:${d(B.out)}`,
      `SUMMARY:Albar · Casa de Mar — ${room.name} (${S.ref})`, `LOCATION:${HOTEL.address}`, `DESCRIPTION:Check-in ${HOTEL.checkIn} · Check-out ${HOTEL.checkOut}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  }

  const root = document.getElementById('ck');
  function render() {
    if (!valid()) { root.innerHTML = msgHtml(k().missing_t, k().missing_p, searchUrl(), k().back_search); return; }
    if (S.step === 'expired') { root.innerHTML = msgHtml(k().expired_t, k().expired_p, searchUrl(), k().search_again); return; }
    const c = calc();
    root.innerHTML = S.step === 'details' ? detailsHtml(c) : S.step === 'pay' ? payHtml(c) : doneHtml(c);
    if (S.step === 'done') document.getElementById('ck-ics').href = icsHref();
  }
  function refreshSide() {
    const c = calc(), side = document.getElementById('ck-side'), btn = document.getElementById('ck-pay');
    if (side) side.innerHTML = summaryHtml(c);
    if (btn) btn.innerHTML = `${A.icon('shield')} ${payLabel(c)}`;
  }
  function go(step) { S.step = step; render(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }

  /* Código que venía de la búsqueda: se aplica si vale */
  if (valid() && S.codeInput) { const r = codeCheck(S.codeInput, calc().n); if (r.ok) { S.code = S.codeInput; S.codeMsg = { ok: true, t: S.code + ' ✓' }; } }

  root.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.g) { S.g[el.dataset.g] = el.type === 'checkbox' ? el.checked : el.value; if (S.bad[el.dataset.g]) { S.bad[el.dataset.g] = false; el.closest('.field')?.classList.remove('is-bad'); } }
    if (el.dataset.in) S[el.dataset.in] = el.value.toUpperCase().trim();
  });
  root.addEventListener('change', e => { const el = e.target; if (el.dataset.g) S.g[el.dataset.g] = el.type === 'checkbox' ? el.checked : el.value; });
  root.addEventListener('click', e => {
    const x = e.target.closest('[data-x]');
    if (x) {
      const id = x.dataset.x, on = !S.extras.includes(id);
      S.extras = on ? [...S.extras, id] : S.extras.filter(v => v !== id);
      x.setAttribute('aria-pressed', on);
      x.querySelector('.xopt__tick').textContent = on ? '✓ ' + k().added : '+ ' + k().add;
      refreshSide();
      return;
    }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const act = a.dataset.act;
    if (act === 'code') {
      if (!S.codeInput) return;
      const r = codeCheck(S.codeInput, calc().n);
      if (r.ok) { S.code = S.codeInput; S.codeMsg = { ok: true, t: S.code + ' ✓' }; } else S.codeMsg = { ok: false, t: k()[r.error] };
      render();
    } else if (act === 'code-rm') { S.code = ''; S.codeInput = ''; S.codeMsg = null; render(); }
    else if (act === 'voucher') {
      if (!S.voucherInput) return;
      if (VOUCHERS[S.voucherInput]) { S.voucher = S.voucherInput; S.voucherMsg = { ok: true, t: S.voucher + ' ✓' }; } else S.voucherMsg = { ok: false, t: k().err_voucher_invalid };
      render();
    } else if (act === 'voucher-rm') { S.voucher = ''; S.voucherInput = ''; S.voucherMsg = null; render(); }
    else if (act === 'back') { e.preventDefault(); S.gwErr = null; go('details'); }
    else if (act === 'pay-fail') { S.gwErr = k().demo_failed; render(); }
    else if (act === 'pay-ok') {
      S.busy = true; S.gwErr = null; render();
      setTimeout(() => {
        S.busy = false;
        const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        S.ref = 'ALB-' + Array.from({ length: 5 }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
        go('done');
      }, 1200);
    } else if (act === 'print') window.print();
  });
  root.addEventListener('submit', e => {
    e.preventDefault();
    const g = S.g;
    S.bad = { name: !g.name.trim(), email: !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g.email), phone: !g.phone.trim(), consent: !g.consent };
    if (Object.values(S.bad).some(Boolean)) {
      S.err = S.bad.consent && !S.bad.name && !S.bad.email && !S.bad.phone ? k().err_consent : k().err_guest;
      render();
      document.querySelector('.is-bad input, .is-bad textarea, .alert')?.scrollIntoView({ block: 'center' });
      return;
    }
    S.err = null;
    go('pay');
  });

  setInterval(() => {
    if (S.step !== 'details' || !valid()) return;
    const left = S.deadline - Date.now();
    if (left <= 0) { go('expired'); return; }
    const el = document.getElementById('ck-timer');
    if (!el) return;
    const mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
    el.querySelector('b').textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    el.classList.toggle('is-low', left < 3 * 60000);
  }, 1000);

  A.renderers.push(render);
})();
</script>
</body>
</html>
